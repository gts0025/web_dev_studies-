<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>popup_project</title>
    
    <style>
        body, html{
            width: 100%;
            height: 100%;
            border: 0;
            transition: all 0.1s;
            font-family: "Times New Roman", Times, serif;
        }
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        button{
            background-color: rgb(75, 75, 255);
            color: rgb(255, 255, 255);
            font-size: 15px;
            border-color: transparent;
            border-radius: 15px;
            height: 40px;
            width: 100px;
            position: fixed;
            transition: all 0.2s;
            translate: -10px 0px;
            box-shadow: 10px 10px  rgba(8, 15, 35, 0.447);
            
        }

        .active_button{
            translate: -10px 150px;
            transition: 0.3s ease-in-out;
            
        }

        

         button:hover{

            background-color: rgb(96, 96, 255);
            color: rgb(255, 255, 255);
            height: 44px;
            width: 110px;
            font-size: 20px;
        }

        button:active{

            background-color: rgb(96, 96, 255);
            color: rgb(255, 255, 255);
            font-size: 10px;
            width: 80px;
            height: 35px;
            transition: 0.1s;
        }



        .popup-close{
            transition: all 0.3s ease-in-out;
            transform: scale(0);
       
        }

        .popup-open{
            
            transition: all 0.3s ease-in-out;
            opacity: 1;
            transform: scale(1);
            width: 200px;
            height: 200px;
            border-radius: 20px;
            background-color: rgb(242, 252, 255);
            color:rgb(11, 158, 237);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 10px 10px  rgba(16, 16, 16, 0.3);
            font-weight:bold;

        }

        .popup-open:hover{
            transition: all 0.2S;
            width: 210px;
            height: 210px;
            font-size: 25px;
        }

        .popup-open:active{
            width: 180px;
            height: 180px;
            font-size: 18px;
        }


    </style>
</head>

<body>
    
    <div id = popup class="popup-close">
        hello world
        
    </div>

    <button onclick="run()">
        click me
    </button>

    <script>
        const clickSound = new Audio("https://example.com/sounds/click.mp3");

        const popup = document.querySelector("#popup");
        const button = document.querySelector("button")
        function call_popup(){
            popup.classList.toggle("popup-open")
            popup.classList.toggle("popup-close"); 
        }

        function call_button(){
            button.classList.toggle("active_button")
        }

        function run (){      
            if (button.classList.contains("active_button")){
                call_popup()
                setTimeout(call_button,300)
                
            }else{
                call_button()
                setTimeout(call_popup,300)
            }
        }
        
    </script>
</body>
</html>
